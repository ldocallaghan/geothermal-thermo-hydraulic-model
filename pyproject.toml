# Package metadata. The models run from src/ (python src/<script>.py) and are
# not installed as a package; the reference results were made with the exact
# versions in requirements-lock.txt.
[project]
name = "quenchwell"
version = "1.3.2"
description = "Models of circulating temperature and borehole stability for drilling into superhot rock"
readme = "README.md"
license = "MIT"
authors = [{ name = "Liam O'Callaghan" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "iapws>=1.5",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.urls]
Repository = "https://github.com/ldocallaghan/geothermal-thermo-hydraulic-model"
